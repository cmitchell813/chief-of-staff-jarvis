<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#02121c"/>
      <stop offset="100%" stop-color="#01060b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#35d6ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#35d6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#35d6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- outer glow -->
  <circle cx="512" cy="512" r="360" fill="url(#glow)"/>

  <!-- tick ring -->
  <g stroke="#35d6ff" stroke-width="6" opacity="0.55">
    <!-- 36 ticks -->
    <g id="ticks"/>
  </g>

  <!-- rings -->
  <circle cx="512" cy="512" r="330" fill="none" stroke="#35d6ff" stroke-width="8" opacity="0.35"/>
  <circle cx="512" cy="512" r="250" fill="none" stroke="#35d6ff" stroke-width="10" opacity="0.85"/>
  <circle cx="512" cy="512" r="250" fill="none" stroke="#8af0ff" stroke-width="2" opacity="0.9"/>

  <!-- core -->
  <circle cx="512" cy="512" r="150" fill="#02202e" stroke="#35d6ff" stroke-width="6"/>
  <text x="512" y="512" font-family="Helvetica, Arial, sans-serif" font-size="150" font-weight="700"
        fill="#8af0ff" text-anchor="middle" dominant-baseline="central" letter-spacing="6">CoS</text>
</svg>
